<style>
/* VOICE: playful, warm, a little cheeky; Kat's own voice, never corporate.
   IDEA: a side-scrolling pixel game. Kat walks a Mexican street where every shop is a project, then catches the flight to London.
   PICTURE: the game screen itself, a 16:9 pixel world in a chunky console frame, with her own sprite.
   COLOUR and TYPE: her brand, turquoise sky fading to beige, black outlines; Pixelify Sans and Silkscreen over Jost for reading.
   LAYOUT: game first under a slim bar; dialog windows for each project; a no-play list for recruiters in a hurry. */
:root{color-scheme:light dark;--bg:light-dark(#efe6d6,#121212);--ink:light-dark(#141113,#f1eadc);--card:#f6f0e4;--tq:#14a396;--mute:light-dark(#5f584d,#a8a092)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Jost,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
.px{font-family:"Pixelify Sans",monospace}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px max(3vw,12px)}
.logo{font:700 26px/1 "Pixelify Sans",monospace;letter-spacing:.02em}
.logo span{color:var(--tq)}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{min-height:44px;padding:0 16px;border:3px solid var(--ink);background:var(--bg);font:600 15px "Pixelify Sans",monospace;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.pbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.pbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pbtn.tq{background:var(--tq);color:#fff;border-color:#111;box-shadow:3px 3px 0 #111}
.coins{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;font:700 16px "Pixelify Sans",monospace;background:#111;color:#f6f0e4;border:3px solid #111}
.coins i{width:16px;height:16px;background:var(--tq);border-radius:50%;box-shadow:inset -3px -3px 0 #0b6f67}
.stage{position:relative;width:min(1240px,96vw);margin:0 auto;border:4px solid #111;box-shadow:8px 8px 0 #111;background:#111}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.intro{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:center;gap:2vw;padding:clamp(16px,3vw,44px);background:#efe6d6ee;color:#141113}
.intro img{width:100%;max-height:100%;object-fit:contain;image-rendering:auto}
.intro h1{font:700 clamp(34px,5.4vw,72px)/.95 "Pixelify Sans",monospace;margin:0 0 10px}
.intro h1 small{display:block;font-size:.42em;color:#0b7d73;margin-top:10px}
.intro p{margin:0 0 14px;max-width:46ch;font-size:clamp(14px,1.4vw,17px)}
.intro .keys{font:500 14px "Pixelify Sans",monospace;color:#5f584d}
.intro .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.intro .pbtn{--ink:#141113;--bg:#efe6d6;color:#141113}
.intro .pbtn.tq{color:#fff}
.hint{width:min(1240px,96vw);margin:14px auto 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;font:500 14px "Pixelify Sans",monospace;color:var(--mute)}
.pad{display:none;width:min(1240px,96vw);margin:16px auto 0;justify-content:space-between;gap:10px;user-select:none;-webkit-user-select:none}
.pad div{display:flex;gap:10px}
.pad button{min-width:64px;min-height:64px;border:3px solid var(--ink);background:var(--bg);font:700 22px "Pixelify Sans",monospace;box-shadow:3px 3px 0 var(--ink);touch-action:none}
.pad button.on{background:var(--tq);color:#fff}
.pad #tEnter[disabled]{opacity:.35}
@media (hover:none),(max-width:760px){.pad{display:flex}}
.note{text-align:center;font-size:13px;color:var(--mute);margin:22px 16px 30px}
.modal{position:fixed;inset:0;background:#0d0c10b3;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.win{position:relative;background:var(--card);color:#141113;border:4px solid #111;box-shadow:8px 8px 0 #111;width:min(980px,100%);max-height:calc(100svh - 32px);overflow:auto;padding:clamp(20px,3vw,36px)}
.win .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kick{font:600 14px "Pixelify Sans",monospace;color:#0b7d73;margin:0 0 6px}
.win h2{font:700 clamp(30px,4vw,48px)/1 "Pixelify Sans",monospace;margin:0;text-wrap:balance}
.deck{font:500 clamp(18px,2vw,22px)/1.3 "Pixelify Sans",monospace;margin:12px 0 0;color:#3b352d;max-width:40ch}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.body{margin:0 0 12px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tags li{font:500 13px "Pixelify Sans",monospace;padding:3px 9px;border:2px solid #141113;background:#fff}
.shots{display:grid;gap:12px}
.shots button{display:block;padding:0;border:3px solid #111;background:#111;cursor:zoom-in}
.shots img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.shots .tall img{object-fit:contain;background:#e9e2d4}
.gal{display:grid;gap:10px}.gal .main{display:block;padding:0;border:3px solid #111;cursor:zoom-in}.gal .main img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs button{width:64px;height:64px;padding:0;border:3px solid #111;opacity:.6}.thumbs button.on,.thumbs button:hover{opacity:1;box-shadow:3px 3px 0 #14a396}.thumbs img{width:100%;height:100%;object-fit:cover;display:block}.thumbs button[data-sel^=logo] img{object-fit:contain;padding:4px}
.fact{margin-top:14px;padding:10px 12px;border:2px dashed #14a396;font-size:14px;color:#3b352d}
.fact b{font-family:"Pixelify Sans",monospace;color:#0b7d73}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:24px;border-top:3px solid #141113;padding-top:16px}
.win .pbtn{--ink:#141113;--bg:#f6f0e4;color:#141113}
.x{flex:none;min-width:44px}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.list button{display:block;text-align:left;padding:0;border:3px solid #111;background:#fff;box-shadow:4px 4px 0 #111}
.list button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #111}
.list img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-bottom:3px solid #111}
.list span{display:block;padding:8px 10px 10px;font:700 17px/1.15 "Pixelify Sans",monospace}
.list small{display:block;font:400 13px Jost,sans-serif;color:#5f584d;margin-top:3px}
.contact{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.contact a{color:#141113;font:600 clamp(17px,2vw,22px) "Pixelify Sans",monospace;overflow-wrap:anywhere;text-decoration-color:#14a396;text-underline-offset:4px}
.contact small{display:block;font-size:13px;color:#5f584d}
.lb{position:fixed;inset:0;background:#0b0b0bf0;display:none;align-items:center;justify-content:center;z-index:40;padding:58px 16px 16px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .pbtn{position:absolute;top:8px;right:12px;--ink:#111;--bg:#f6f0e4;color:#111}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);visibility:hidden;max-width:min(520px,92vw);background:#111;color:#f6f0e4;border:3px solid #f6f0e4;box-shadow:4px 4px 0 #14a396;padding:12px 16px;font-size:15px;z-index:30;transition:transform .3s}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast b{display:block;font:700 17px "Pixelify Sans",monospace;color:#5fd8cc}
@media(max-width:760px){.intro{grid-template-columns:1fr;overflow:auto;align-items:start}.intro img{display:none}.grid2{grid-template-columns:1fr}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{box-shadow:5px 5px 0 #111}}
@media(max-width:760px){.intro{position:static}.stage:not(.playing) canvas{display:none}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

jarritos:{n:'Sobremesa × Jarritos',y:'2026',k:{en:'Spec campaign for the UK · art direction & copy',es:'Campaña spec para UK · dirección de arte y copy'},d:{en:'English doesn’t have a word for it. We do.',es:'El inglés no tiene palabra para eso. Nosotros sí.'},
b:{en:'A self-initiated campaign that gives Jarritos a reason to exist in Britain beyond the taco: it hands the country a word for something it already does. Out of home at Canary Wharf, the Tube and the pub, plus packaging, retail, social, film and an activation.',es:'Una campaña propia que le da a Jarritos una razón para existir en Gran Bretaña más allá del taco: le regala al país una palabra para algo que ya hace. Exteriores en Canary Wharf, el metro y el pub, más empaque, punto de venta, redes, film y una activación.'},
t:{en:['Concept','Art direction','Copy','OOH','Packaging','Social'],es:['Concepto','Dirección de arte','Copy','Exteriores','Empaque','Redes']},s:{en:'Concept, art direction, copy and design: all mine. Not commissioned by or affiliated with Jarritos.',es:'Concepto, dirección de arte, copy y diseño: todo mío. No es un encargo de Jarritos ni está afiliado a la marca.'}},
tawa:{n:'Tawa Tlan Salsas',y:'2024',k:{en:'Brand identity',es:'Identidad de marca'},d:{en:'A salsa brand that had to look made by hand, because it is.',es:'Una marca de salsas que tenía que verse hecha a mano, porque lo es.'},
b:{en:'A hand-drawn chile stroke, a greca pattern and a circular seal carry the whole identity across six touchpoints: jars, bottles, bag, shop sign, apron and T-shirt. Everything had to survive a cheap print run and still feel like a family recipe.',es:'Un trazo de chile dibujado a mano, una greca y un sello circular sostienen toda la identidad en seis puntos de contacto: frascos, botellas, bolsa, letrero, mandil y playera. Todo tenía que aguantar una impresión barata y seguir sintiéndose receta de familia.'},
t:{en:['Logo & seal','Greca pattern','Packaging','Signage','Merch'],es:['Logo y sello','Greca','Empaque','Letrero','Merch']},s:{en:'It began as a pencil sketch, and the system obeys a one-ink rule.',es:'Empezó como boceto a lápiz, y el sistema obedece la regla de una sola tinta.'}},
chiq:{n:'Chiquitita Repostería',y:'2021',k:{en:'Brand identity',es:'Identidad de marca'},d:{en:'A small-batch bakery, designed end to end by one person.',es:'Una repostería de lotes pequeños, diseñada de punta a punta por una sola persona.'},
b:{en:'Logo system, colour, typography and packaging for a handmade pastry shop, plus a kit of templates the owners could run with on their own. Sweet without being saccharine.',es:'Sistema de logo, color, tipografía y empaque para una repostería artesanal, más un kit de plantillas para que las dueñas pudieran seguir solas. Dulce sin empalagar.'},
t:{en:['Logo system','Packaging','Templates'],es:['Sistema de logo','Empaque','Plantillas']},s:{en:'Years later they still make on-brand material without me. That was the point.',es:'Años después siguen produciendo material on-brand sin mí. Esa era la idea.'}},
cosm:{n:'La Cosmetiquería',y:'2026',k:{en:'Rebrand & design system',es:'Rebranding y design system'},d:{en:'A Guadalajara cosmetics brand, rebuilt around the Flor de Mayo.',es:'Una marca de cosmética de Guadalajara, reconstruida alrededor de la Flor de Mayo.'},
b:{en:'New identity, packaging, web and tokens, so every product on the shelf speaks the same language and the next one practically designs itself.',es:'Identidad nueva, empaque, web y tokens, para que cada producto en el anaquel hable el mismo idioma y el siguiente casi se diseñe solo.'},
t:{en:['Identity','Packaging','Web','Design tokens'],es:['Identidad','Empaque','Web','Tokens']},s:{en:'The case study opens with the old website, so you can see where it started.',es:'El case study arranca con el sitio anterior, para que se vea de dónde partió.'}},
rkt:{n:'RKT Reketefácil',y:'2022–2024',k:{en:'Brand identity & mascot · in-house at Raxa Global',es:'Identidad de marca y mascota · in-house en Raxa Global'},d:{en:'One business. Two names. Three taglines. No system.',es:'Un negocio. Dos nombres. Tres taglines. Ningún sistema.'},
b:{en:'Raxa Global sells phones on installments in Mexico, and it had two competing logos, two names and three taglines. The job wasn’t to add a third logo but to decide what the brand already was and give it one face: a monogram with a mirrored R, a purple block, a green name band, and Reke, a white cat who became the brand’s face. Then templates the team could run without me.',es:'Raxa Global vende celulares a pagos en México, y tenía dos logos compitiendo, dos nombres y tres taglines. El trabajo no era agregar un tercer logo sino decidir qué era ya la marca y darle una sola cara: un monograma con la R invertida, un bloque morado, una banda verde con el nombre y Reke, una gatita blanca que se volvió la cara de la marca. Después, plantillas para que el equipo siguiera sin mí.'},
t:{en:['Logo system','Mascot','Colour & type','Templates','Social'],es:['Sistema de logo','Mascota','Color y tipografía','Plantillas','Redes']},s:{en:'The mascot is called Reke, and she outlived my time there. She’s still in use.',es:'La mascota se llama Reke, y sobrevivió a mi salida. Se sigue usando.'}},
rktapp:{n:'RKT Pay',y:'2022–2024',k:{en:'App UX/UI & launch campaign · Raxa Global',es:'UX/UI de app y campaña de lanzamiento · Raxa Global'},d:{en:'The friendly way to pay off your phone.',es:'La forma amable de terminar de pagar tu celular.'},
b:{en:'Buyers finance a phone over 12 months but often lose track of due dates and balances. The app gives the credit one warm home: next payment up front, clear progress, one-tap top-ups, and Reke showing up as a guide at key moments. After the launch campaign, delinquency fell from 45% to 20%: one customer in two behind on payments became one in five.',es:'Quien compra un celular a 12 meses suele perder de vista fechas y saldos. La app le da al crédito una sola casa amable: el siguiente pago al frente, progreso claro, recargas en un toque y Reke apareciendo como guía en los momentos clave. Después de la campaña de lanzamiento, la morosidad bajó del 45% al 20%: de uno de cada dos clientes atrasados a uno de cada cinco.'},
t:{en:['UX/UI','Payments flow','Onboarding','Launch campaign'],es:['UX/UI','Flujo de pago','Onboarding','Campaña de lanzamiento']},s:{en:'Paying from home removed the biggest barrier: the trip to the store.',es:'Pagar desde casa quitó la barrera más grande: ir a la tienda.'}},
alph:{n:'Alpheka Human Health',y:'2026',k:{en:'Brand identity',es:'Identidad de marca'},d:{en:'Health is a human experience.',es:'La salud es una experiencia humana.'},
b:{en:'An identity for a healthcare brand that speaks about people before procedures. Healthcare brands tend to look like the procedure: cold blues, hard edges, a red cross that means emergency. So the cross softened its corners and opened up to hold a four-point star, the moment care turns into relief. Plum, sage, charcoal and cream replace hospital white, across stationery, wayfinding, uniforms and textiles.',es:'Una identidad para una marca de salud que habla de personas antes que de procedimientos. Las marcas de salud suelen parecerse al procedimiento: azules fríos, esquinas duras, una cruz roja que significa emergencia. Así que la cruz suavizó sus esquinas y se abrió para guardar una estrella de cuatro puntas, el momento en que el cuidado se vuelve alivio. Ciruela, salvia, carbón y crema reemplazan el blanco de hospital, en papelería, señalética, uniformes y textiles.'},
t:{en:['Symbol & wordmark','Colour','Stationery','Wayfinding','Uniforms'],es:['Símbolo y logotipo','Color','Papelería','Señalética','Uniformes']},s:{en:'The star is a counter, not a sticker: it always shows whatever surface sits behind it.',es:'La estrella es un hueco, no una calcomanía: siempre deja ver la superficie que hay detrás.'}},
alphapp:{n:{en:'Alpheka · Patient app',es:'Alpheka · App para pacientes'},y:'2026',k:{en:'Product design · iOS',es:'Diseño de producto · iOS'},d:{en:'An app that lowers anxiety, not information.',es:'Una app que baja la ansiedad, no la información.'},
b:{en:'A full redesign of the patient app for a private hospital group. The goal was that someone with an appointment tomorrow understands what to do in five seconds, with one thumb. Sixteen high-fidelity screens, a condensed design system and WCAG 2.2 AA from the first decision.',es:'Rediseño completo de la app para pacientes de un grupo hospitalario privado. La meta: que alguien con cita mañana entienda qué hacer en cinco segundos y con un pulgar. Dieciséis pantallas en alta fidelidad, un design system condensado y WCAG 2.2 AA desde la primera decisión.'},

function content(id){if(P[id]){const p=P[id];return `<p class="kick">${tr(p.k)} · ${p.y}</p><h2>${tr(p.n)}</h2><p class="deck">${tr(p.d)}</p><div class="grid2"><div><p class="body">${tr(p.b)}</p><ul class="tags">${tr(p.t).map(x=>`<li>${x}</li>`).join('')}</ul>${got.has(id)?`<div class="fact"><b>★ ${tr(UI.fact)}</b><br>${tr(p.s)}</div>`:`<div class="fact">${tr(UI.hidden)}</div>`}</div>${gal(GAL[id]||[])}</div>`}
if(id==='about')return `<p class="kick">${L=='en'?'Kat’s studio · editor’s letter':'Estudio Kat · carta editorial'}</p><h2>${L=='en'?'Hi, I’m Kat.':'Hola, soy Kat.'}</h2><div class="grid2"><div><p class="body">${L=='en'?'Senior graphic designer and art director with ten years across branding, editorial, UX/UI, packaging and paid media. I started out laying out magazines in Mexico and never stopped thinking in spreads. I hold an MA in Editorial Design, I write in two languages, and I use AI as part of the production line, not instead of it.':'Diseñadora gráfica senior y directora de arte con diez años entre branding, editorial, UX/UI, empaque y medios pagados. Empecé formando revistas en México y nunca dejé de pensar en pliegos. Tengo maestría en Diseño Editorial, escribo en dos idiomas y uso la IA como parte de la producción, no en su lugar.'}</p><p class="body">${L=='en'?'Walk east. Every shop on this street is a project, and the street ends where I’m headed.':'Camina hacia la derecha. Cada local de esta calle es un proyecto, y la calle termina hacia donde voy.'}</p></div>${gal(['kat-hd'])}</div>`;
if(id==='editorial')return `<p class="kick">${L=='en'?'Back issues · editorial design':'Números atrasados · diseño editorial'}</p><h2>${L=='en'?'Before brands, there were magazines.':'Antes de las marcas, hubo revistas.'}</h2><div class="grid2"><div><p class="body">${L=='en'?'Líder, Mexijuku and Estridente taught me the grid, the deadline and the cover line. Líder, on politics and business, was rebuilt around a single editorial grid; Estridente is an independent cultural magazine for Xalapa, art-directed from masthead to colophon.':'Líder, Mexijuku y Estridente me enseñaron la retícula, el cierre y la línea de portada. Líder, de política y negocios, se rehízo alrededor de una sola retícula; Estridente es una revista cultural independiente de Xalapa, con dirección de arte del cabezal al colofón.'}</p><ul class="tags"><li>${L=='en'?'Editorial design':'Diseño editorial'}</li><li>${L=='en'?'Art direction':'Dirección de arte'}</li><li>${L=='en'?'MA, Universidad Gestalt':'Maestría, Universidad Gestalt'}</li></ul></div>${gal(['estr-grid','estr-cover','lider-spread','lider'])}</div>`;
if(id==='brief')return `<p class="kick">${L=='en'?'Gallery · six more, quickly':'Galería · seis más, rápido'}</p><h2>${L=='en'?'In brief':'En breve'}</h2><div class="list">${BRIEF.map(b=>`<button data-zoom="${b[0]}"><img src="${thumb(b[0])}" alt="" loading="lazy"><span>${b[1]}<small>${tr(b[2])}</small></span></button>`).join('')}</div>`;
if(id==='contact')return `<p class="kick">${L=='en'?'The red phone box':'La cabina roja'}</p><h2>${L=='en'?'Let’s make the next level.':'Hagamos el siguiente nivel.'}</h2><p class="deck">${L=='en'?'Based in México, relocating to the UK. Open to remote work, in English and Spanish.':'Desde México, mudándome a UK. Abierta a trabajo remoto, en inglés y español.'}</p><ul class="contact"><li><small>Email</small><a href="mailto:akaiart.design@gmail.com">akaiart.design@gmail.com</a></li><li><small>LinkedIn</small><a href="https://linkedin.com/in/karlakatgonzalez">linkedin.com/in/karlakatgonzalez</a></li><li><small>Behance</small><a href="https://www.behance.net/KarlaKetzer">behance.net/KarlaKetzer</a></li><li><small>Web</small><a href="https://katketzer.github.io">katketzer.github.io</a></li></ul>`;
if(id==='bonus')return `<p class="kick">${L=='en'?'Secret door · 10/10 seals':'Puerta secreta · 10/10 sellos'}</p><h2>${L=='en'?'You found them all.':'Los encontraste todos.'}</h2><p class="deck">${L=='en'?'Here’s who’s on the moodboard behind every shop.':'Esto es lo que hay en el moodboard detrás de cada local.'}</p><ul class="contact">${[[{en:'Fashion',es:'La moda'},{en:'My first reference, always',es:'Mi primera referencia, siempre'}],['Alexey Brodovitch',{en:'For making white space move',es:'Por hacer que el espacio en blanco se mueva'}],['Fabien Baron',{en:'For type that behaves like a photograph',es:'Por tipografía que se comporta como fotografía'}],['Irma Boom',{en:'For books as objects',es:'Por los libros como objetos'}],['Paula Scher',{en:'For loud, joyful identity',es:'Por identidades ruidosas y felices'}],['Vivienne Westwood',{en:'For the nerve',es:'Por la osadía'}]].map(([a,b])=>`<li><small>${tr(b)}</small><span class="px" style="font-size:20px;font-weight:600">${tr(a)}</span></li>`).join('')}</ul>`;
return ''}
function list(){return `<p class="kick">${L=='en'?'No game, just the work':'Sin juego, solo el trabajo'}</p><h2>${L=='en'?'Every shop on the street':'Todos los locales de la calle'}</h2><div class="list">${order.filter(id=>id!=='bonus').map(id=>{const p=P[id];const im=p?(GAL[id]||['rkt-store'])[0]:{about:'kat-hd',editorial:'estr-cover',brief:'boladeoro',contact:'jar-canary'}[id];const n=p?tr(p.n):{about:L=='en'?'About Kat':'Sobre Kat',editorial:L=='en'?'Back issues':'Números atrasados',brief:L=='en'?'In brief':'En breve',contact:L=='en'?'Contact':'Contacto'}[id];
const sub=p?tr(p.k):{about:L=='en'?'Editor’s letter':'Carta editorial',editorial:'Líder · Mexijuku · Estridente',brief:BRIEF.map(b=>b[1]).slice(0,3).join(', ')+'…',contact:'akaiart.design@gmail.com'}[id];
return `<button data-open="${id}">${id==='qm'?`<div style="aspect-ratio:3/2;background:#141113;color:#7ff5ea;display:grid;place-items:center;font:700 42px Silkscreen,monospace;border-bottom:3px solid #111;text-shadow:0 0 12px #36e0d0">LED</div>`:`<img src="${thumb(im)}" alt="" loading="lazy" style="background:${LBG[im]||'#fff'};object-fit:${im.startsWith('logo-')||im==='kat-hd'?'contain':'cover'};${im.startsWith('logo-')?'padding:14px':''}">`}<span>${n}<small>${sub}</small></span></button>`}).join('')}</div>`}
let curId=null;const modal=$('#modal'),win=$('#win');
function open(id){if(id==='sign'){SFX.blip();toast(`<b>${tr(UI.next2)}</b>${tr(UI.nextT)}`);return}if(!modal.classList.contains('on'))SFX.open();A.duck=.35;curId=id;paused=true;Object.keys(keys).forEach(k=>keys[k]=false);
const i=order.indexOf(id);const nav=id==='list'?'':`<div class="nav"><button class="pbtn" data-nav="-1" ${i<=0?'disabled':''}>${tr(UI.prev)}</button><button class="pbtn" data-list="1">${tr(UI.list)}</button><button class="pbtn tq" data-nav="1" ${i>=order.length-1?'disabled':''}>${tr(UI.next)}</button></div>`;
win.innerHTML=`<div class="top"><div></div><div style="display:flex;gap:8px"><button class="pbtn" data-lang="1">${tr(UI.lang)}</button><button class="pbtn x" data-close="1" aria-label="${tr(UI.close)}">✕</button></div></div>${id==='list'?list():content(id)}${nav}`;modal.classList.add('on');win.scrollTop=0;win.querySelector('[data-close]').focus()}
function close(){SFX.close();A.duck=1;modal.classList.remove('on');paused=false;curId=null;C.focus()}
win.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.close)return close();if(b.dataset.lang)return $('#bLang').onclick();if(b.dataset.list)return open('list');
if(b.dataset.open){const o=S.find(s=>s.id===b.dataset.open);if(o&&started){pl.x=o.x+o.w/2;}return open(b.dataset.open)}
if(b.dataset.nav){const i=order.indexOf(curId)+ +b.dataset.nav;const id=order[i];if(!id)return;const o=S.find(s=>s.id===id);if(o)pl.x=o.x+o.w/2;return open(id)}
if(b.dataset.sel){const g=b.closest('.gal'),mb=g.querySelector('.main'),n=b.dataset.sel;mb.dataset.zoom=n;mb.style.background=LBG[n]||'#e9e2d4';mb.querySelector('img').src=full(n);g.querySelectorAll('.thumbs button').forEach(x=>x.classList.toggle('on',x===b));return}
if(b.dataset.zoom){const lb=$('#lb');lb.querySelector('img').src=full(b.dataset.zoom);lb.classList.add('on');$('#lbx').focus()}});
modal.addEventListener('click',e=>{if(e.target===modal)close()});
$('#lb').onclick=()=>$('#lb').classList.remove('on');
function start(){started=true;audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();$('#intro').style.display='none';$('#stage').classList.add('playing');C.focus()}
$('#bPlay').onclick=start;$('#bSkip').onclick=()=>open('list');$('#bList').onclick=()=>open('list');
$('#bSnd').onclick=toggleSound;
$('#bReset').onclick=()=>{got.clear();try{localStorage.removeItem('kg-coins')}catch(e){}hud();toast(`<b>${L=='en'?'Seals reset':'Sellos reiniciados'}</b>${L=='en'?'All ten are back on the street.':'Los diez volvieron a la calle.'}`)};
$('#bLang').onclick=()=>{L=L=='en'?'es':'en';try{localStorage.setItem('kg-lang',L)}catch(e){}texts();if(curId)open(curId)};
function texts(){document.documentElement.lang=L;$('#bList').textContent=tr(UI.list);$('#bLang').textContent=tr(UI.lang);$('#iT').innerHTML=tr(UI.iT);$('#iP').textContent=tr(UI.iP);$('#iK').textContent=tr(UI.iK);$('#bPlay').textContent='▶ '+tr(UI.play);$('#bSkip').textContent=tr(UI.list);$('#h1').textContent=tr(UI.h1);soundBtn();$('#bReset').textContent=L=='en'?'↺ Reset seals':'↺ Reiniciar sellos';$('#h2').textContent=tr(UI.h2);$('#note').textContent=tr(UI.note);hud()}
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',e:'enter',E:'enter',Enter:'enter',ArrowDown:'enter',s:'enter',S:'enter'};
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#lb').classList.contains('on'))$('#lb').classList.remove('on');else if(modal.classList.contains('on'))close();return}
if(modal.classList.contains('on')||$('#lb').classList.contains('on'))return;
if(!started&&(e.key==='Enter'||e.key===' ')){e.preventDefault();start();return}
if((e.key==='m'||e.key==='M')&&started){toggleSound();return}
const k=KM[e.key];if(k&&started){e.preventDefault();if((k==='jump'||k==='enter')&&e.repeat)return;keys[k]=true}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k==='left'||k==='right')keys[k]=false});
C.addEventListener('pointerdown',e=>{if(!started)return;const r=C.getBoundingClientRect(),wx=(e.clientX-r.left)/r.width*VW+cam,wy=(e.clientY-r.top)/r.height*VH;const o=S.find(o=>wx>=o.x&&wx<=o.x+o.w&&wy>GY-o.h-30&&wy<GY+10&&(o.id!=='bonus'||got.size>=TOTAL));if(o){target=o.x+o.w/2;if(Math.abs(pl.x-target)<8){target=null;open(o.id)}}});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();if(!started)start();keys[k]=true;b.classList.add('on')};const off=e=>{if(k==='left'||k==='right')keys[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
C.tabIndex=0;texts();
const go=()=>requestAnimationFrame(frame);
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('16px Silkscreen'),document.fonts.load('16px "Pixelify Sans"')]).catch(()=>{}):Promise.resolve()).then(go);
}
</script>
</body>
</html>
